services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-astar_db}
      POSTGRES_USER: ${DB_USER:-astar_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-astar_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-astar_user} -d ${DB_NAME:-astar_db}"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db # dentro la rete docker il database si chiama "db"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
